global:
  scrape_interval: 3s
  scrape_timeout: 2s
  evaluation_interval: 3s
rule_files: [/etc/prometheus/rules.yml]
scrape_configs:
  - job_name: hw11-api
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [hw11]
    relabel_configs:
      - {action: keep, source_labels: [__meta_kubernetes_pod_label_app, __meta_kubernetes_pod_container_port_name], regex: 'hw11-api;http'}
      - {action: replace, source_labels: [__meta_kubernetes_pod_name], target_label: pod}
  - job_name: kube-state
    static_configs:
      - targets: ['hw11-kube-state:8080']
