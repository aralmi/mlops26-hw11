groups:
- name: hw11
  rules:
  - alert: Hw11HighTTFC
    expr: |
      histogram_quantile(0.95, sum by (le) (rate(hw11_ttfc_seconds_bucket[30s]))) > 0.6
      and sum(increase(hw11_ttfc_seconds_count[30s])) >= 15
    for: 12s
    labels: {severity: warning}
    annotations: {summary: 'p95 TTFC exceeds 0.6 s with at least 15 successes in 30 s'}
  - alert: Hw11HighRejectionRate
    expr: |
      sum(rate(hw11_requests_total{outcome="rejected"}[30s])) /
      sum(rate(hw11_requests_total[30s])) > 0.10
      and sum(increase(hw11_requests_total[30s])) >= 20
    for: 12s
    labels: {severity: warning}
    annotations: {summary: 'Queue rejection rate exceeds 10% with at least 20 outcomes in 30 s'}
