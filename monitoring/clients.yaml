apiVersion: v1
kind: Pod
metadata:
  name: hw11-client-0
  namespace: hw11
  labels: {app: hw11-client}
spec:
  automountServiceAccountToken: false
  containers:
  - name: client
    image: hw11-api:1.0.0
    imagePullPolicy: Never
    command: ["python", "-c", "import time; time.sleep(1000000)"]
    env:
    - name: POD_NAME
      valueFrom: {fieldRef: {fieldPath: metadata.name}}
    - name: POD_IP
      valueFrom: {fieldRef: {fieldPath: status.podIP}}
    resources:
      requests: {cpu: 30m, memory: 32Mi}
      limits: {cpu: 400m, memory: 96Mi}
---
